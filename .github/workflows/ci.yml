name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the committed model still beats the rule it replaced
        run: |
          node --input-type=module -e "
            import w from './src/ml/weights.js';
            const t = w.training;
            if (!t) throw new Error('weights.js has no training block');
            if (!(t.improvement_pct > 25)) {
              throw new Error('model no longer beats the naive rule: ' + t.improvement_pct);
            }
            console.log('model ok: MAE ' + t.mae + ' vs naive ' + t.naive_mae);
          "
