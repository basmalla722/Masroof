<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Masroof - track what you spend." />
    <title>Masroof</title>
    <script>
      try {
        var saved = localStorage.getItem("expense-tracker-theme");
        if (saved === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
